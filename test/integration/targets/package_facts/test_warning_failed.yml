- hosts: all
  tasks:
    - name: Check for apk
      distronode.builtin.command: apk info
      ignore_errors: true
      register: apk_exists

    - when: apk_exists is failed
      block:
        - name: Create a mock apk
          distronode.builtin.copy:
            dest: /usr/bin/apk
            src: apk
            mode: "0755"
          become: true

        - name: Elicit a warning about failing to list packages
          distronode.builtin.package_facts:
            manager: apk
          failed_when: false

        - name: Remove the mock
          distronode.builtin.file:
            dest: /usr/bin/apk
            state: absent
          become: true
