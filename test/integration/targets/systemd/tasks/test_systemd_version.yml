---
- name: Show Gathered Facts
  distronode.builtin.debug:
    msg: "{{ distronode_systemd }}"

- name: Assert the systemd version fact
  distronode.builtin.assert:
    that:
      - distronode_systemd.version | int
      - distronode_systemd.version is match('^[1-9][0-9][0-9]$')
      - distronode_systemd.features | regex_search('(\\+|-)(PAM|AUDIT)')
