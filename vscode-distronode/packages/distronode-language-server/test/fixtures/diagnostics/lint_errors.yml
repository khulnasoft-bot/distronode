---
- name: Test play
  hosts: localhost
  vars:
    MY_VAR: faulty
  tasks:
    - distronode.builtin.debug:
        msg: Happy debugging

    - name: Comparison
      distronode.builtin.ping:
        data: 10101
      when: MY_VAR != ''

    - name: This would typically fire deprecated-command-syntax
      command:
        cmd: warn=no chmod 644 X

    - name: Copy the CA certificate
      distronode.builtin.copy:
        src: ../../files/certs/ca.crt
        dest: /root/ca.crt
        owner: root
        group: root
        mode: "0644"
      tags:
        - certs
