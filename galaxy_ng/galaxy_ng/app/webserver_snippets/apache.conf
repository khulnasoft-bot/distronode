RewriteEngine  on
RewriteCond "%{REQUEST_FILENAME}"       !-f
RewriteCond "%{REQUEST_FILENAME}"       !-d
RewriteRule "^/ui*" "${pulp-api}/static/galaxy_ng/index.html" [P]
ProxyPass "/ui/" "${pulp-api}/static/galaxy_ng/index.html"
ProxyPassReverse "/ui/" "${pulp-api}/static/galaxy_ng/index.html"

# WARNING: This is a workaround. It must be removed once
#          RBAC policies are configured for pulp_distronode and pulpcore APIs.
<Location "/pulp/api/v3/users/">
    Deny from all;
</Location>

<Location "/pulp/api/v3/groups/">
    Deny from all;
</Location>

<Location "/pulp/api/v3/remotes/distronode/">
    Deny from all;
</Location>

<Location "/pulp/api/v3/repositories/distronode/">
    Deny from all;
</Location>

<Location "/pulp/api/v3/distributions/distronode/">
    Deny from all;
</Location>

<Location ~ "^/pulp_distronode/galaxy/">
    Deny from all;
</Location>
