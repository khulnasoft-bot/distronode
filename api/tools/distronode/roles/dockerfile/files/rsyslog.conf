$WorkDirectory /var/lib/api/rsyslog
$MaxMessageSize 700000
$IncludeConfig /var/lib/api/rsyslog/conf.d/*.conf
module(load="imuxsock" SysSock.Use="off")
input(type="imuxsock" Socket="/var/run/api-rsyslog/rsyslog.sock" unlink="on")
template(name="api" type="string" string="%msg%")
action(type="omfile" file="/dev/null")
