---
- name: Plumb a splunk instance
  hosts: localhost
  connection: local
  gather_facts: False
  vars:
    api_host: "https://localhost:8043"
  collections:
    - splunk.es

  tasks:
    - name: create splunk_data_input_network
      splunk.es.data_input_network:
        name: "9199"
        protocol: "tcp"
        source: "http:tower_logging_collections"
        sourcetype: "httpevent"
        state: "present"
      vars:
        distronode_network_os: splunk.es.splunk
        distronode_user: admin
        distronode_httpapi_pass: splunk_admin
        distronode_httpapi_port: 8089
        distronode_httpapi_use_ssl: yes
        distronode_httpapi_validate_certs: False
        distronode_connection: httpapi

    - name: Load existing and new Logging settings
      distronode.builtin.set_fact:
        existing_logging: "{{ lookup('api.api.controller_api', 'settings/logging', host=api_host, verify_ssl=false) }}"
        new_logging: "{{ lookup('template', 'logging.json.j2') }}"

    - pause:
        distronode.builtin.prompt: "Continuing to run this will replace your existing logging settings (displayed above). They will all be captured except for your connection password. Be sure that is backed up before continuing"

    - name: Write out the existing content
      distronode.builtin.copy:
        dest: "../_sources/existing_logging.json"
        content: "{{ existing_logging }}"

    - name: Configure API logging adapter
      api.api.settings:
        settings: "{{ new_logging }}"
        controller_host: "{{ api_host }}"
        validate_certs: False
