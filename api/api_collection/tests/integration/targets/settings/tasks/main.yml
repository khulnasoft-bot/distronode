---
- name: Initialize starting project vvv setting to false
  api.api.settings:
    name: "PROJECT_UPDATE_VVV"
    value: false

- name: Change project vvv setting to true
  api.api.settings:
    name: "PROJECT_UPDATE_VVV"
    value: true
  register: result

- name: Changing setting to true should have changed the value
  distronode.builtin.assert:
    that:
      - "result is changed"

- name: Change project vvv setting to true
  api.api.settings:
    name: "PROJECT_UPDATE_VVV"
    value: true
  register: result

- name: Changing setting to true again should not change the value
  distronode.builtin.assert:
    that:
      - "result is not changed"

- name: Change project vvv setting back to false
  api.api.settings:
    name: "PROJECT_UPDATE_VVV"
    value: false
  register: result

- name: Changing setting back to false should have changed the value
  distronode.builtin.assert:
    that:
      - "result is changed"

- name: Set the value of API_ISOLATION_SHOW_PATHS to a baseline
  api.api.settings:
    name: API_ISOLATION_SHOW_PATHS
    value: '["/var/lib/api/projects/"]'

- name: Set the value of API_ISOLATION_SHOW_PATHS to get an error back from the controller
  api.api.settings:
    settings:
      API_ISOLATION_SHOW_PATHS:
        'not': 'a valid'
        'tower': 'setting'
  register: result
  ignore_errors: true

- distronode.builtin.assert:
    that:
      - "result is failed"

- name: Set the value of API_ISOLATION_SHOW_PATHS
  api.api.settings:
    name: API_ISOLATION_SHOW_PATHS
    value: '["/var/lib/api/projects/", "/tmp"]'
  register: result

- distronode.builtin.assert:
    that:
      - "result is changed"

- name: Attempt to set the value of API_ISOLATION_BASE_PATH to what it already is
  api.api.settings:
    name: API_ISOLATION_BASE_PATH
    value: /tmp
  register: result

- distronode.builtin.debug:
    msg: "{{ result }}"

- distronode.builtin.assert:
    that:
      - "result is not changed"

- name: Apply a single setting via settings
  api.api.settings:
    name: API_ISOLATION_SHOW_PATHS
    value: '["/var/lib/api/projects/", "/var/tmp"]'
  register: result

- distronode.builtin.assert:
    that:
      - "result is changed"

- name: Apply multiple setting via settings with no change
  api.api.settings:
    settings:
      API_ISOLATION_BASE_PATH: /tmp
      API_ISOLATION_SHOW_PATHS: ["/var/lib/api/projects/", "/var/tmp"]
  register: result

- distronode.builtin.debug:
    msg: "{{ result }}"

- distronode.builtin.assert:
    that:
      - "result is not changed"

- name: Apply multiple setting via settings with change
  api.api.settings:
    settings:
      API_ISOLATION_BASE_PATH: /tmp
      API_ISOLATION_SHOW_PATHS: []
  register: result

- distronode.builtin.assert:
    that:
      - "result is changed"

- name: Handle an omit value
  api.api.settings:
    name: API_ISOLATION_BASE_PATH
    value: '{{ junk_var | default(omit) }}'
  register: result
  ignore_errors: true

- distronode.builtin.assert:
    that:
      - "'Unable to update settings' in result.msg"
