---
- name: Create Role Definition
  role_definition:
    name: test_view_jt
    permissions:
      - api.view_jobtemplate
      - api.execute_jobtemplate
    content_type: api.jobtemplate
    description: role definition to launch job
    state: present
  register: result

- assert:
    that:
      - result is changed

- name: Delete Role Definition
  role_definition:
    name: test_view_jt
    permissions:
      - api.view_jobtemplate
      - api.execute_jobtemplate
    content_type: api.jobtemplate
    description: role definition to launch job
    state: absent
  register: result

- assert:
    that:
      - result is changed
